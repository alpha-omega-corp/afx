services:
    db:
        image: postgres:17
        environment:
            POSTGRES_USER: afx
            POSTGRES_PASSWORD: afx
            POSTGRES_DB: afx
        volumes:
            - pgdata:/var/lib/postgresql/data
        ports:
            - "5433:5432"
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U afx -d afx" ]
            interval: 3s
            timeout: 3s
            retries: 10

volumes:
    pgdata:

