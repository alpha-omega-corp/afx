<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <title>La Côte au crépuscule : les vignes, le lac et les Alpes en face</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141210"></stop>
      <stop offset="0.45" stop-color="#2a1a14"></stop>
      <stop offset="0.8" stop-color="#7a3814"></stop>
      <stop offset="1" stop-color="#B84A0E"></stop>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a2a18"></stop>
      <stop offset="1" stop-color="#171210"></stop>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF8A3D" stop-opacity="0.7"></stop>
      <stop offset="1" stop-color="#FF8A3D" stop-opacity="0"></stop>
    </radialGradient>
    <clipPath id="sky-only"><rect width="1600" height="470"></rect></clipPath>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence>
      <feColorMatrix type="saturate" values="0"></feColorMatrix>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.08"></feFuncA></feComponentTransfer>
    </filter>
  </defs>
