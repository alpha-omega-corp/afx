<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <title>Une table qui attend, le soir, sous la lampe</title>
  <defs>
    <radialGradient id="room" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#2c211a"></stop>
      <stop offset="1" stop-color="#141210"></stop>
    </radialGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF8A3D" stop-opacity="0.28"></stop>
      <stop offset="1" stop-color="#FF8A3D" stop-opacity="0"></stop>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF8A3D" stop-opacity="0.5"></stop>
      <stop offset="1" stop-color="#FF8A3D" stop-opacity="0"></stop>
    </radialGradient>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121a22"></stop>
      <stop offset="1" stop-color="#3a2618"></stop>
    </linearGradient>
    <g id="chair" fill="none" stroke="#3d2b1f" stroke-linecap="round">
      <path d="M-58 0 C-70 -90 -60 -160 0 -170 C60 -160 70 -90 58 0" stroke-width="14"></path>
      <path d="M-36 -20 C-44 -80 -38 -130 0 -136 C38 -130 44 -80 36 -20" stroke-width="8"></path>
      <path d="M-70 4 H70" stroke-width="16"></path>
      <path d="M-58 10 L-66 130 M58 10 L66 130 M-40 10 L-34 130 M40 10 L34 130" stroke-width="9"></path>
      <path d="M-60 80 H60" stroke-width="5"></path>
    </g>
    <g id="glass">
      <path d="M-22 -80 C-24 -40 -14 -20 0 -18 C14 -20 24 -40 22 -80 Z" fill="#f3ede4" fill-opacity="0.12" stroke="#a39b90" stroke-width="3"></path>
      <path d="M-20 -50 C-18 -30 -10 -22 0 -21 C10 -22 18 -30 20 -50 Z" fill="#7a2233"></path>
      <path d="M0 -18 V14 M-16 14 H16" stroke="#a39b90" stroke-width="3" stroke-linecap="round"></path>
    </g>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence>
      <feColorMatrix type="saturate" values="0"></feColorMatrix>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.08"></feFuncA></feComponentTransfer>
    </filter>
  </defs>
