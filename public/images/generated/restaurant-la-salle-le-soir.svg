  <path d="M742 250 L858 250 L866 262 L734 262 Z" fill="#F26B1D"></path>
  <ellipse cx="800" cy="312" rx="102" ry="10" fill="#FF8A3D"></ellipse>

  <use href="#chair" x="400" y="630"></use>
  <use href="#chair" x="1200" y="630"></use>

