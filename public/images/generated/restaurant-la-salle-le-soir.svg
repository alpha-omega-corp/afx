  <path d="M510 598 H1090 L1100 740 C960 752 640 752 500 740 Z" fill="#e6dccb"></path>
  <path d="M590 610 C584 660 588 700 580 744 M700 610 C696 670 700 710 694 748 M900 610 C904 670 900 710 906 748 M1010 610 C1016 660 1012 700 1020 744" stroke="#d2c5af" stroke-width="3" fill="none"></path>
  <rect x="500" y="590" width="600" height="16" rx="4" fill="#f3ede4"></rect>

  <circle cx="800" cy="520" r="70" fill="url(#halo)"></circle>
  <rect x="790" y="532" width="20" height="58" rx="3" fill="#f3ede4"></rect>
  <path d="M800 496 C812 512 812 524 800 530 C788 524 788 512 800 496 Z" fill="#FF8A3D"></path>
  <rect x="776" y="584" width="48" height="8" rx="3" fill="#a39b90"></rect>
  <use href="#glass" x="690" y="590"></use>
  <use href="#glass" x="910" y="590"></use>
  <ellipse cx="585" cy="586" rx="46" ry="8" fill="#d8cdb9"></ellipse>
  <ellipse cx="1015" cy="586" rx="46" ry="8" fill="#d8cdb9"></ellipse>
  <rect width="1600" height="900" filter="url(#grain)"></rect>
</svg>
