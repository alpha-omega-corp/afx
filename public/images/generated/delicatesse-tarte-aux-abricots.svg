<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <title>Une tarte aux abricots, une part déjà servie</title>
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.48" r="0.5">
      <stop offset="0" stop-color="#F26B1D" stop-opacity="0.28"></stop>
      <stop offset="1" stop-color="#F26B1D" stop-opacity="0"></stop>
    </radialGradient>
    <g id="apricot">
      <ellipse rx="44" ry="36" fill="#e98f2e"></ellipse>
      <ellipse rx="34" ry="26" fill="#f4a94a"></ellipse>
      <ellipse cx="-10" cy="-10" rx="12" ry="7" fill="#ffffff" fill-opacity="0.35"></ellipse>
    </g>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence>
      <feColorMatrix type="saturate" values="0"></feColorMatrix>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.08"></feFuncA></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="#1E1B18"></rect>
  <circle cx="600" cy="450" r="440" fill="url(#glow)"></circle>
  <circle cx="614" cy="466" r="330" fill="#000" fill-opacity="0.35"></circle>
  <circle cx="600" cy="450" r="330" fill="#e9e1d4"></circle>
  <circle cx="600" cy="450" r="300" fill="#f3ede4"></circle>
  <circle cx="600" cy="450" r="262" fill="#c98c4e" stroke="#b07437" stroke-width="22" stroke-dasharray="18 12"></circle>
  <circle cx="600" cy="450" r="236" fill="#e6c38a"></circle>
  <g transform="translate(600 450)">
    <use href="#apricot" transform="rotate(0) translate(0 -175) rotate(90)"></use>
    <use href="#apricot" transform="rotate(40) translate(0 -175) rotate(90)"></use>
    <use href="#apricot" transform="rotate(80) translate(0 -175) rotate(90)"></use>
    <use href="#apricot" transform="rotate(200) translate(0 -175) rotate(90)"></use>
    <use href="#apricot" transform="rotate(240) translate(0 -175) rotate(90)"></use>
    <use href="#apricot" transform="rotate(280) translate(0 -175) rotate(90)"></use>
    <use href="#apricot" transform="rotate(320) translate(0 -175) rotate(90)"></use>
    <use href="#apricot" transform="rotate(20) translate(0 -95) rotate(90)"></use>
    <use href="#apricot" transform="rotate(80) translate(0 -95) rotate(90)"></use>
    <use href="#apricot" transform="rotate(260) translate(0 -95) rotate(90)"></use>
    <use href="#apricot" transform="rotate(320) translate(0 -95) rotate(90)"></use>
    <use href="#apricot"></use>
    <path d="M0 0 L140 -224 A264 264 0 0 1 262 -30 Z" transform="rotate(100)" fill="#f3ede4"></path>
    <path d="M0 0 L140 -224" transform="rotate(100)" stroke="#b07437" stroke-width="6"></path>
    <path d="M0 0 L262 -30" transform="rotate(100)" stroke="#b07437" stroke-width="6"></path>
  </g>
  <g fill="#f3ede4" fill-opacity="0.8">
    <circle cx="380" cy="300" r="3"></circle><circle cx="820" cy="360" r="3"></circle><circle cx="700" cy="640" r="3"></circle><circle cx="460" cy="560" r="3"></circle>
  </g>
  <rect width="1200" height="900" filter="url(#grain)"></rect>
</svg>
