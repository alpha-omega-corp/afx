<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <title>Un verre de chasselas, sa bouteille et une grappe de raisin</title>
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.48" r="0.5">
      <stop offset="0" stop-color="#F26B1D" stop-opacity="0.28"></stop>
      <stop offset="1" stop-color="#F26B1D" stop-opacity="0"></stop>
    </radialGradient>
    <linearGradient id="bottle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f2a18"></stop>
      <stop offset="0.35" stop-color="#3c4d2a"></stop>
      <stop offset="1" stop-color="#1a2314"></stop>
